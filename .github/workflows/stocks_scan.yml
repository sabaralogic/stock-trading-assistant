name: Stock Trading Assistant

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-site:
    runs-on: ubuntu-latest

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: |
          python -m playwright install chromium

      - name: Run stock scanner custom
        run: |
          python main.py --symbols-file data/stocks.txt

      - name: Run stock scanner NIFTY500
        run: |
          python main.py

      - name: Run backtest
        run: |
          python main.py --symbols-file data/stocks.txt --period 1y --backtest

      - name: Build GitHub Pages site
        run: |
          rm -rf site
          mkdir -p site
          cp webapp/templates/index.html site/index.html
          cp webapp/templates/stock.html site/stock.html
          cp -R webapp/static site/static
          touch site/.nojekyll
          echo "stocks.sabaralogic.com" > site/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-site:
    needs: build-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
